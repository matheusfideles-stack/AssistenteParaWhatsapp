spring.application.name=assistente-backend
server.port=8080

# Caminho do banco SQLite local (relativo ao diretorio onde o jar/app roda).
assistente.db-path=data/assistente.db

# Intervalo padrao (minutos) em que uma tarefa vencida continua sendo
# relembrada ate ser concluida, quando ela nao define seu proprio intervalo.
assistente.default-reminder-interval-minutes=30

logging.level.root=WARN
logging.level.com.assistente=INFO
